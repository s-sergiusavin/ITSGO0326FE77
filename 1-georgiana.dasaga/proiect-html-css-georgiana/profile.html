<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butterfly – Profile</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/profile.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <i class="bi bi-stars"></i>
            <span class="brand">Butterfly</span>
        </div>

        <div class="nav-center">
            <a href="feed.html"><i class="bi bi-house"></i></a>
            <a href="auth.html"><i class="bi bi-box-arrow-in-right"></i></a>
            <a href="profile.html"><i class="bi bi-person"></i></a>
            <a href="landing-page.html"><i class="bi bi-window"></i></a>
        </div>

        <div class="nav-right">
            <input type="text" placeholder="Search..." class="search-bar">
            <button><i class="bi bi-search"></i></button>
        </div>
    </nav>


    <!-- PROFILE PAGE LAYOUT -->
    <div class="profile-container">

        <!-- HEADER -->
        <div class="profile-header">
            <img src="./assets/profile img.jpg" class="profile-avatar">

            <h2 class="profile-name">Vanessa Iulia Manea</h2>
            <p class="profile-username">@vanessa.m</p>

            <p class="profile-bio">
                Makeup lover • Skincare obsessed • Pink aesthetic
                <br>✨ “Confidence is the best makeup.” ✨
            </p>

            <div class="profile-stats">
                <div><strong>54</strong><span>Posts</span></div>
                <div><strong>1.2k</strong><span>Followers</span></div>
                <div><strong>320</strong><span>Following</span></div>
            </div>

            <button class="edit-btn"><i class="bi bi-pencil"></i> Edit Profile</button>
        </div>

        <hr class="divider">

        <!-- POSTS GRID -->
        <h3 class="section-title">Posts Tagged In</h3>

        <div class="posts-grid">
            <img src="./assets/soft.jpg">
            <img src="./assets/fond-de-ten-2.jpg">
            <img src="./assets/ser ten uscat.webp">
            <img src="./assets/maria profile img.jpg">

        </div>

    </div>

</body>

</html>
