<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media App | Profile Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <header class="navbar">
        <nav class="nav-links">
            <a href="feed.html" class="back-link">
            <i class="bi bi-arrow-left"></i>
        </a>
        </nav>
    </header>

    <div class="profile-header-bg"></div>

    <main class="profile-container">
        <div class="profile-card">
            <div class="profile-top-actions">
                <button class="action-btn"><i class="bi bi-person-plus"></i> Connect</button>
                <div class="profile-avatar-wrapper">
                    <img src="./assets/EU.jpeg" alt="Avatar" class="main-avatar">
                </div>
                <button class="action-btn"><i class="bi bi-chat-dots"></i> Message</button>
            </div>

            <div class="profile-info">
                <h1>Chiritoiu Cosmin</h1>
                <p class="location">București, România</p>
                
                <p class="bio">Digital Artist - UI/UX Enthusiast</p>
                <p class="institution">Universitatea de Artă - București</p>

                <div class="profile-stats">
                    <div class="stat">
                        <strong>120</strong>
                        <span>Urmăritori</span>
                    </div>
                    <div class="stat">
                        <strong>43</strong>
                        <span>Lucrări</span>
                    </div>
                    <div class="stat">
                        <strong>512</strong>
                        <span>Aprecieri</span>
                    </div>
                </div>

                <button class="show-more-btn">Vezi Portofoliu</button>
            </div>
        </div>
        <img src="./assets/pattern.png" class="back-pattern">
    </main>

</body>
</html>
