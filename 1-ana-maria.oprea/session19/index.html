<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session 19 | DOM</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>HTML Events & DOM manipulations</h1>

    <div id="testBox">Acesta este un div demo</div>
    <img
      src="https://s3-prod.dogtopia.com/wp-content/uploads/2019/03/0-570x380.jpg"
      alt="puppy"
      width="200"
      id="demoImage"
    />
    <img src="" alt="new image" width="250" id="newImage" />

    <ul>
      <li>Elem 1</li>
      <li>Elem 2</li>
      <li>Elem 3</li>
      <li>Elem 4</li>
      <li>Elem 5</li>
    </ul>

    <div id="clickMe">Click me!!!</div>
    <input type="text" id="demoInput" />

    <div class="toDoList">
      <div>
        <label for="toDoInput">Add Item</label>
        <input
          type="text"
          name="toDoInput"
          id="toDoInput"
          placeholder="Enter your value"
        />
      </div>
      <button class="addButton">Add</button>
    </div>

    <ul class="toDoListItems"></ul>

    <form action="" id="myForm" novalidate>
      <label>
        <span>Email</span>
        <input type="email" placeholder="Enter your email" name="emailInput" />
      </label>
      <input type="submit" value="Check email" />
    </form>

    <script src="js/main.js"></script>
  </body>
</html>
