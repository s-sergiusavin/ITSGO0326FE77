<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Media App | Auth</title>
    <link rel="stylesheet" href="./css/auth.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <section class="form-container">
      <h1>Login</h1>

      <form action="">
        <div class="form-field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" />
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
          />
        </div>

        <div class="form-field">
          <input type="checkbox" id="rememberUser" />
          <label for="rememberUser">Click here to remember me</label>
        </div>

        <input type="submit" value="Log in" class="login-button" />
        <a href="#" class="forgot-password-btn"><strong>Forgot password?</strong></a>
      </form>

      <hr />
      <button class="register-btn">Create an account</button>
      <a href="feed.html">Catre contul meu</a>
    </section>
  </body>
</html>
