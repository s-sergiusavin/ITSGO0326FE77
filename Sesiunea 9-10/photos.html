<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect | Photos</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./CSS/photos.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">Connect</div>
        <a href="./feed.html" class="back-btn"><i class="bi bi-arrow-left"></i> Back to Feed</a>
    </header>

    <div class="photos-container">
        <h2>Your Photos</h2>

        <div id="gallery" class="gallery"></div>
    </div>

    <script>
        // Generate 20 random photos
        function loadPhotos() {
            const gallery = document.getElementById("gallery");
            let html = "";

            for (let i = 0; i < 20; i++) {
                html += `
                    <div class="photo-card">
                        <img src="https://picsum.photos/300?random=${Date.now() + Math.random()}" />
                    </div>
                `;
            }

            gallery.innerHTML = html;
        }

        loadPhotos();
    </script>

</body>
</html>
