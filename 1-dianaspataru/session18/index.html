<!-- on mouse enter and on mouse leave -->

<div class="green-square" onmouseenter="mouseEnter()" onmouseleave="mouseLeave()"></div>

<!-- on click event -->

<!-- on focus si on blur  -->

<label for="demoInput">Demo input event</label>
<input type="text" id="demoInput" onfocus="focusInput()" onblur="blurInput()">


<!-- on key down and on key up  -->

<label for="demoKey">Demo key event</label>
<input type="text" name="" id="demoKey" onkeyup="onKeyUp()" onkeydown="onKeyDown()">
