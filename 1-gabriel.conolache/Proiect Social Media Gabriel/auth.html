<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Media App | Login</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/auth.css" />
  <!-- Font Awesome Free 6 (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <div class="auth-wrapper">

    <!-- Brand -->
    <div class="auth-brand">
      <div class="logo">NEX<span>US</span></div>
      <p class="tagline">Connect &middot; Share &middot; Discover</p>
    </div>

    <!-- Card -->
    <section class="form-container">
      <h1>Welcome back</h1>
      <p class="card-subtitle">Sign in to continue your journey</p>

      <form action="">

        <div class="form-field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" />
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" />
        </div>

        <div class="form-field check-row">
          <input type="checkbox" id="rememberUser" />
          <label for="rememberUser">Remember me on this device</label>
        </div>

        <input type="submit" value="Sign In" class="login-button" onclick="location.href='feed.html'; return false;" />

      </form>

      <div class="auth-links">
        <a href="#" class="forgot-password-btn"><strong>Forgot password?</strong></a>
        <a href="feed.html">Go to my account &rarr;</a>
      </div>

      <div class="auth-divider">
        <hr /><span>or</span><hr />
      </div>

      <button class="register-btn" onclick="location.href='feed.html'">
        <i class="fa-solid fa-user-plus"></i>
        &nbsp; Create an account
      </button>

    </section>
  </div>

</body>
</html>
