<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Media App | Profile Page</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/profile.css" />
  <!-- Font Awesome Free 6 (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <header class="app-header">
    <a href="auth.html" class="header-logo">NEX<span>US</span></a>

    <div class="header-search">
      <i class="fa-solid fa-magnifying-glass icon-search"></i>
      <input type="text" placeholder="Search people, posts, events&hellip;" />
    </div>

    <nav class="nav-actions">
      <a href="feed.html" class="nav-btn" title="Feed">
        <i class="fa-solid fa-house"></i>
      </a>
      <a href="landing-page.html" class="nav-btn" title="Events">
        <i class="fa-solid fa-calendar"></i>
      </a>
      <button class="nav-btn" title="Messages">
        <i class="fa-solid fa-message"></i>
        <span class="badge">3</span>
      </button>
      <button class="nav-btn" title="Notifications">
        <i class="fa-solid fa-bell"></i>
        <span class="badge">7</span>
      </button>
      <a href="profile.html">
        <img src="./assets/profile.webp" alt="My profile" class="nav-avatar" style="border-color:#e8c97a;box-shadow:0 0 0 3px rgba(201,168,76,.2)" />
      </a>
    </nav>
  </header>

  <!-- ═══ PAGE BODY ═══ -->
  <div class="page-body">

    <!-- Cover -->
    <div class="profile-cover">
      <img src="./assets/background-image.jpg" alt="Cover" />
    </div>

    <!-- Info area -->
    <div class="profile-info-area">

      <div class="profile-avatar-wrap">
        <img src="./assets/profile.webp" alt="Alex Morgan" />
      </div>

      <div class="profile-top-row">
        <button class="btn-ghost">
          <i class="fa-solid fa-message"></i>&nbsp; Message
        </button>
        <button class="btn-gold">
          + &nbsp;Follow
        </button>
      </div>

      <div class="profile-name-area">
        <h1>Alex Morgan</h1>
        <p class="profile-handle">@alex.morgan &nbsp;&middot;&nbsp; <span class="gold-label">Premium Member</span></p>
        <p class="profile-bio">
          Designer &amp; developer passionate about creating beautiful digital experiences.
          Lover of summer parties, good coffee, and clean code. &#127775;
        </p>
        <div class="profile-stats">
          <div class="stat">
            <p class="num">1.4K</p>
            <p class="lbl">Posts</p>
          </div>
          <div class="stat">
            <p class="num">28.6K</p>
            <p class="lbl">Followers</p>
          </div>
          <div class="stat">
            <p class="num">843</p>
            <p class="lbl">Following</p>
          </div>
        </div>
      </div>

      <div class="profile-tabs">
        <button class="tab-btn active" onclick="setTab(this)">Posts</button>
        <button class="tab-btn" onclick="setTab(this)">Photos</button>
        <button class="tab-btn" onclick="setTab(this)">Videos</button>
        <button class="tab-btn" onclick="setTab(this)">Saved</button>
      </div>

    </div><!-- /profile-info-area -->

    <!-- Photo grid -->
    <div class="profile-grid">

      <div class="grid-post">
        <img src="./assets/post2.webp" alt="Post 1" />
        <div class="grid-post-overlay">
          <span><i class="fa-solid fa-heart"></i> 248</span>
          <span><i class="fa-regular fa-comment"></i> 47</span>
        </div>
      </div>

      <div class="grid-post">
        <img src="./assets/post2.webp" alt="Post 2" style="filter:hue-rotate(40deg)" />
        <div class="grid-post-overlay">
          <span><i class="fa-solid fa-heart"></i> 133</span>
          <span><i class="fa-regular fa-comment"></i> 22</span>
        </div>
      </div>

      <div class="grid-post">
        <img src="./assets/post2.webp" alt="Post 3" style="filter:hue-rotate(80deg) saturate(1.3)" />
        <div class="grid-post-overlay">
          <span><i class="fa-solid fa-heart"></i> 94</span>
          <span><i class="fa-regular fa-comment"></i> 18</span>
        </div>
      </div>

      <div class="grid-post">
        <img src="./assets/post2.webp" alt="Post 4" style="filter:hue-rotate(200deg)" />
        <div class="grid-post-overlay">
          <span><i class="fa-solid fa-heart"></i> 312</span>
          <span><i class="fa-regular fa-comment"></i> 61</span>
        </div>
      </div>

      <div class="grid-post">
        <img src="./assets/post2.webp" alt="Post 5" style="filter:sepia(.5)" />
        <div class="grid-post-overlay">
          <span><i class="fa-solid fa-heart"></i> 77</span>
          <span><i class="fa-regular fa-comment"></i> 9</span>
        </div>
      </div>

      <div class="grid-post">
        <img src="./assets/post2.webp" alt="Post 6" style="filter:hue-rotate(300deg)" />
        <div class="grid-post-overlay">
          <span><i class="fa-solid fa-heart"></i> 189</span>
          <span><i class="fa-regular fa-comment"></i> 34</span>
        </div>
      </div>

    </div><!-- /profile-grid -->

  </div><!-- /page-body -->

  <!-- ═══ MOBILE NAV ═══ -->
  <nav class="mobile-nav">
    <a href="feed.html" class="mob-btn">
      <i class="fa-solid fa-house"></i> Feed
    </a>
    <a href="landing-page.html" class="mob-btn">
      <i class="fa-solid fa-calendar"></i> Events
    </a>
    <button class="mob-btn">
      <i class="fa-solid fa-compass"></i> Explore
    </button>
    <button class="mob-btn">
      <i class="fa-solid fa-message"></i> Msgs
    </button>
    <a href="profile.html" class="mob-btn active">
      <i class="fa-solid fa-user"></i> Profile
    </a>
  </nav>

  <script>
    function setTab(el) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }
  </script>

</body>
</html>
